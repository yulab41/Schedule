name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: schedule_test
          MYSQL_USER: schedule_test_app
          MYSQL_PASSWORD: schedule_test_password
          MYSQL_ROOT_PASSWORD: schedule_test_root_password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uschedule_test_app -pschedule_test_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache build caches
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            apps/web/node_modules/.vite
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml', 'apps/web/vite.config.*', 'tsconfig.base.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Check GitHub configuration formatting
        run: >-
          pnpm exec prettier --check ".github/**/*.yml"
          "docs/deployment/**/*.md"

      - name: Check formatting, lint, and types
        run: |
          pnpm format:check &
          format_pid=$!
          pnpm lint &
          lint_pid=$!
          pnpm typecheck &
          typecheck_pid=$!
          fail=0
          wait "$format_pid" || fail=1
          wait "$lint_pid" || fail=1
          wait "$typecheck_pid" || fail=1
          exit $fail

      - name: Build and run tests
        env:
          NODE_ENV: test
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          TEST_MYSQL_DATABASE: schedule_test
          TEST_MYSQL_USER: schedule_test_app
          TEST_MYSQL_PASSWORD: schedule_test_password
        run: |
          pnpm build &
          build_pid=$!
          pnpm test &
          test_pid=$!
          fail=0
          wait "$build_pid" || fail=1
          wait "$test_pid" || fail=1
          exit $fail
