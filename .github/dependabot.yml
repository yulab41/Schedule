version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '04:00'
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - '*'
    ignore:
      # typescript-eslint and the Vue toolchain do not support TypeScript 7
      # yet; remove these ignores once supported and verified.
      - dependency-name: 'typescript'
        versions:
          - '>=7'
      - dependency-name: 'eslint'
        versions:
          - '>=10'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '04:00'
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
