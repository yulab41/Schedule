name: medical-schedule-prod

# 2G 小机器资源铁律（2026-08-08 用户要求，详见 docs/deployment/ecs-deployment-pitfalls.md）：
# - 单机单入口：web（Nginx）一个容器承担静态托管与 /api 反向代理；未来接域名后在此入口按子域名路由并启用 HTTPS。
# - 全机复用同一个 MySQL 实例：每个应用独立 database + 账号，不再为单个应用单独起 MySQL。
# - 每个容器都设内存上限；容器日志统一 json-file 轮转；镜像清理见 infra/scripts/ecs-bootstrap.sh。
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 1024m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - schedule_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysql --protocol=TCP -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-runtime
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Production authentication is account/password login. Development auth
      # is intentionally fixed off here; local/CI test Compose is separate.
      NODE_ENV: production
      AUTH_DEV_MODE: 'false'
      AUTH_PASSWORD_ENABLED: 'true'
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      HOLIDAY_ADMIN_UIDS: ${HOLIDAY_ADMIN_UIDS:-}
      PLATFORM_ADMIN_UIDS: ${PLATFORM_ADMIN_UIDS:-}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_APPSECRET: ${WECHAT_APPSECRET:-}
      WECHAT_SESSION_SECRET: ${WECHAT_SESSION_SECRET:-}
      WECHAT_WEB_APPID: ${WECHAT_WEB_APPID:-}
      WECHAT_WEB_APPSECRET: ${WECHAT_WEB_APPSECRET:-}
      WECHAT_WEB_REDIRECT_URI: ${WECHAT_WEB_REDIRECT_URI:-}
      WECHAT_MOCK_MODE: ${WECHAT_MOCK_MODE:-false}
      WECHAT_QR_ENV_VERSION: ${WECHAT_QR_ENV_VERSION:-release}
      WECHAT_DUTY_REMINDER_TEMPLATE_ID: ${WECHAT_DUTY_REMINDER_TEMPLATE_ID:-}
      MINIPROGRAM_SUPPORTED_CLIENT_VERSIONS: ${MINIPROGRAM_SUPPORTED_CLIENT_VERSIONS:-}
      MINIPROGRAM_LEGACY_CLIENT_VERSION: ${MINIPROGRAM_LEGACY_CLIENT_VERSION:-}
      MINIPROGRAM_CAPABILITY_GLOBAL_ENABLED: ${MINIPROGRAM_CAPABILITY_GLOBAL_ENABLED:-false}
      MINIPROGRAM_CAPABILITY_CORE_ENABLED: ${MINIPROGRAM_CAPABILITY_CORE_ENABLED:-false}
      MINIPROGRAM_CAPABILITY_WORKFLOWS_ENABLED: ${MINIPROGRAM_CAPABILITY_WORKFLOWS_ENABLED:-false}
      MINIPROGRAM_CAPABILITY_ORGANIZATION_ENABLED: ${MINIPROGRAM_CAPABILITY_ORGANIZATION_ENABLED:-false}
      MINIPROGRAM_CAPABILITY_INSIGHTS_ENABLED: ${MINIPROGRAM_CAPABILITY_INSIGHTS_ENABLED:-false}
      MINIPROGRAM_CAPABILITY_EXTERNAL_MESSAGES_ENABLED: ${MINIPROGRAM_CAPABILITY_EXTERNAL_MESSAGES_ENABLED:-false}
      MINIPROGRAM_CAPABILITY_GUEST_ENABLED: ${MINIPROGRAM_CAPABILITY_GUEST_ENABLED:-false}
    volumes:
      - schedule_backups:/data/backups
      # Trial-ECS workaround: mount a flattened, symlink-free production
      # node_modules tree built on a developer machine. The trial server never
      # installs dependencies or builds images.
      - ../../runtime/api-flat/node_modules:/app/apps/api/node_modules:ro
      # The trial server also mounts the current API/package dist built on the
      # developer machine, so the old image only provides the Node runtime.
      # Remove these mounts once the ECS can build or pull fresh images.
      - ../../apps/api/dist:/app/apps/api/dist:ro
      - ../../migrations:/app/migrations:ro
      - ../../packages/contracts/dist:/app/packages/contracts/dist:ro
      - ../../packages/database/dist:/app/packages/database/dist:ro
      - ../../packages/scheduling-domain/dist:/app/packages/scheduling-domain/dist:ro
      # Infra scripts (holiday import etc.) live under /app/infra, so the flat
      # dependency tree must also be resolvable from /app/node_modules.
      - ../../runtime/api-flat/node_modules:/app/node_modules:ro
      # Fresh-database bootstrap needs the holiday import script and source JSON.
      - ../../infra/scripts/dist:/app/infra/scripts/dist:ro
      - ../../infra/holidays:/app/infra/holidays:ro
    depends_on:
      mysql:
        condition: service_healthy

  web:
    # Trial deployment serves a dist bundle built on a developer machine.
    # infra/docker/Dockerfile.web remains available for environments that can
    # build the web image themselves.
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书目录（enable-https.sh 签发后挂载，未配置时为空目录即可）
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api

volumes:
  schedule_mysql_data:
  schedule_backups:
