name: medical-schedule-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - schedule_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysql --protocol=TCP -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 试用期自托管部署以开发模式运行（NODE_ENV=development + AUTH_DEV_MODE=true），
      # 使本地开发认证端口生效；正式上线前必须完成自建认证并切回 NODE_ENV=production。
      NODE_ENV: development
      AUTH_DEV_MODE: 'true'
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      HOLIDAY_ADMIN_UIDS: ${HOLIDAY_ADMIN_UIDS:-}
      PLATFORM_ADMIN_UIDS: ${PLATFORM_ADMIN_UIDS:-}
    volumes:
      - schedule_backups:/data/backups
      # Trial-ECS workaround: mount a flattened, symlink-free production
      # node_modules tree built on a developer machine. The trial server never
      # installs dependencies or builds images.
      - ../../runtime/api-flat/node_modules:/app/apps/api/node_modules:ro
    depends_on:
      mysql:
        condition: service_healthy

  web:
    # Trial deployment serves a dist bundle built on a developer machine.
    # infra/docker/Dockerfile.web remains available for environments that can
    # build the web image themselves.
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      # 试用期临时门禁（浏览器密码提示）：值填任意提示名（如 Trial_access）即开启，
      # 填 off 即关闭。仅限当前非正式测试阶段；微信小程序/正式上线改用微信账号登录前
      # 必须改回 off 并按 docs/deployment/aliyun-ecs.md 移除门禁。
      NGINX_BASIC_AUTH_REALM: ${NGINX_BASIC_AUTH_REALM:-off}
      NGINX_BASIC_AUTH_USER_FILE: ${NGINX_BASIC_AUTH_USER_FILE:-/etc/nginx/.htpasswd}
    ports:
      - '80:80'
    volumes:
      - ../../apps/web/dist:/usr/share/nginx/html:ro
      # Official nginx image renders *.template from /etc/nginx/templates into
      # /etc/nginx/conf.d at container start (envsubst keeps $host/$uri intact).
      - ./nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      # 门禁密码文件：服务器本地生成、不入库；启用门禁前必须先创建
      #（生成命令见 docs/deployment/aliyun-ecs.md）。
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api

volumes:
  schedule_mysql_data:
  schedule_backups:
