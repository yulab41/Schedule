log_format schedule_privacy
    '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';
error_log /dev/stderr emerg;

server {
    # Shared gateway default: never serve this project's files for an IP or an
    # unconfigured Host. Future sites must add their own explicit server_name.
    listen 80 default_server;
    server_name _;
    access_log /dev/stdout schedule_privacy;
    return 444;
}

server {
    # Unknown HTTPS SNI/Host values are rejected during the TLS handshake, so
    # they cannot receive this project's certificate or content.
    listen 443 ssl default_server;
    server_name _;
    access_log /dev/stdout schedule_privacy;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name hosp.schedule.eylinhome.top;
    access_log /dev/stdout schedule_privacy;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hosp.schedule.eylinhome.top;
    access_log /dev/stdout schedule_privacy;

    ssl_certificate /etc/letsencrypt/live/hosp.schedule.eylinhome.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosp.schedule.eylinhome.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff2;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://api:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
