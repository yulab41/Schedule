log_format schedule_privacy
    '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';
error_log /dev/stderr emerg;
limit_req_zone $binary_remote_addr zone=schedule_telemetry:1m rate=30r/m;

server {
    # Shared gateway default: never serve this project's files for an IP or an
    # unconfigured Host. Future sites must add their own explicit server_name.
    listen 80 default_server;
    server_name _;
    access_log /dev/stdout schedule_privacy;
    return 444;
}

server {
    # Unknown HTTPS SNI/Host values are rejected during the TLS handshake, so
    # they cannot receive this project's certificate or content.
    listen 443 ssl default_server;
    server_name _;
    access_log /dev/stdout schedule_privacy;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name hosp.schedule.eylinhome.top;
    access_log /dev/stdout schedule_privacy;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hosp.schedule.eylinhome.top;
    access_log /dev/stdout schedule_privacy;

    ssl_certificate /etc/letsencrypt/live/hosp.schedule.eylinhome.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosp.schedule.eylinhome.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff2;

    location = /api/client-telemetry {
        client_max_body_size 16k;
        limit_req zone=schedule_telemetry burst=10 nodelay;
        proxy_pass http://api:3000/client-telemetry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://api:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}


# Independent AI tool virtual hosts and budgets.
limit_req_zone $binary_remote_addr zone=aitool_parse:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=aitool_prepare:1m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=aitool_files:1m;
limit_conn_zone $server_name zone=aitool_total:1m;
server {
    listen 80;
    server_name aitool.eylinhome.top;
    access_log off;
    location /.well-known/acme-challenge/ { root /etc/letsencrypt/aitool/acme; }
    location / { return 301 https://aitool.eylinhome.top$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name aitool.eylinhome.top;
    ssl_certificate /etc/letsencrypt/live/aitool.eylinhome.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aitool.eylinhome.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 8k;
    limit_conn aitool_total 32;
    limit_conn aitool_files 16;
    limit_conn_status 429;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_max_temp_file_size 0;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location = /local {
        proxy_pass http://host.docker.internal:18769/static/local.html;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
    location /static/local/ {
        proxy_pass http://host.docker.internal:18769;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }
    location /api/private/ {
        proxy_pass http://host.docker.internal:18769;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location = /api/parse {
        limit_req zone=aitool_parse burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://host.docker.internal:18769;
        proxy_set_header Host $host;
        proxy_read_timeout 100s;
    }
    location /api/media/ {
        default_type application/json;
        return 403 '{"detail":"本机模式不使用服务器中转，请刷新网页直接下载。"}';
    }
    location = /api/videos/prepare {
        default_type application/json;
        return 403 '{"detail":"已切换本机模式，服务器准备已停用，请刷新网页。"}';
    }
    location /api/videos/files/ {
        default_type application/json;
        return 403 '{"detail":"本机模式不从服务器下载媒体，请使用来源直连或本地文件合并。"}';
    }

    # Browser-only document scanner. Image bytes never reach this service.
    location = /scan {
        proxy_pass http://host.docker.internal:18769/static/scan.html;

        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

        add_header Cache-Control "no-cache";
    }
    location = /static/scan/worker.js {
        proxy_pass http://host.docker.internal:18769;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
    location /static/scan/ {
        proxy_pass http://host.docker.internal:18769;

        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://host.docker.internal:18769;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
}
