name: medical-schedule-test

services:
  mysql:
    image: mysql:8.4
    command: ["--disable-log-bin"]
    environment:
      MYSQL_DATABASE: ${TEST_MYSQL_DATABASE:?Set TEST_MYSQL_DATABASE in .env.}
      MYSQL_USER: ${TEST_MYSQL_USER:?Set TEST_MYSQL_USER in .env.}
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:?Set TEST_MYSQL_PASSWORD in .env.}
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:?Set TEST_MYSQL_ROOT_PASSWORD in .env.}
    ports:
      - "${TEST_MYSQL_PORT:-3307}:3306"
    tmpfs:
      - /var/lib/mysql:rw,noexec,nosuid,size=1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql --protocol=TCP -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e \"SELECT 1\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
