name: schedule-directory-query-isolation

services:
  mysql:
    image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    command:
      - --disable-log-bin
      - --innodb-buffer-pool-size=134217728
      - --innodb-buffer-pool-dump-at-shutdown=OFF
      - --innodb-buffer-pool-load-at-startup=OFF
      - --performance-schema=ON
      - --performance-schema-max-digest-length=8192
      - --performance-schema-max-sql-text-length=16384
    environment:
      MYSQL_DATABASE: schedule_directory_benchmark
      MYSQL_PASSWORD: local-benchmark-app
      MYSQL_ROOT_PASSWORD: local-benchmark-root
      MYSQL_USER: schedule_directory_benchmark
    ports:
      - '127.0.0.1:3317:3306'
    volumes:
      - directory_query_isolation_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysql --protocol=TCP -h 127.0.0.1 -uschedule_directory_benchmark -plocal-benchmark-app -e "SELECT 1"
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 20s

volumes:
  directory_query_isolation_data:
    name: schedule_directory_query_isolation_data
